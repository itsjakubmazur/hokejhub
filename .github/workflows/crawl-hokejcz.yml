name: Crawl hokej.cz

# Works through the hokej.cz crawl queue (history, corrections, games that should be over) and
# refreshes the precomputed statistics of what it stored. Runs here rather than on Vercel, whose
# Hobby plan caps function CPU time; Actions minutes are free for this public repository.
# Secrets: DATABASE_URL, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
    # Right after the evening extraliga round (~23:45 Prague).
    - cron: "47 21 * * *"

concurrency:
  group: crawl-hokejcz
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: pnpm -C apps/web exec tsx scripts/jobs.ts crawl 330
