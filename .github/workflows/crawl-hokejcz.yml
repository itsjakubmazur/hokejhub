name: Crawl hokej.cz history

# Drives the polite crawler on Vercel (/api/ingest/hokejcz) until the queue is empty. Each call
# first re-queues games that should be over but are not final in the database, and ends by
# refreshing the precomputed statistics for the games it wrote.
# Each call processes ~45 s of work (one page every ~2.5 s per worker). Two workers run in
# parallel; when the job-time limit is near and work remains, the run re-dispatches itself,
# so the crawl does not depend on GitHub's (unreliable) cron. Requires repo secret CRON_SECRET
# (same value as the Vercel env var).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
    # Right after the evening extraliga round (~23:45 Prague): finished games, then the stats refresh.
    - cron: "47 21 * * *"

concurrency:
  group: crawl-hokejcz
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        worker: [1, 2]
    steps:
      - name: Drive crawler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: https://hokejhub.vercel.app/api/ingest/hokejcz
        run: |
          # Stagger the workers so they don't hit hokej.cz at the same moment.
          sleep $(( (${{ matrix.worker }} - 1) * 20 ))
          end=$(( $(date +%s) + 330*60 ))
          idle=0
          while [ "$(date +%s)" -lt "$end" ]; do
            out=$(curl -sS -m 70 -X POST "$ENDPOINT?budget=50" -H "Authorization: Bearer $CRON_SECRET" || echo '{"processed":-1}')
            n=$(echo "$out" | jq -r '.processed // -1')
            echo "$(date -u +%H:%M:%S) processed=$n $(echo "$out" | jq -c '[.log[]? | select(.ok|not)]')"
            if [ "$n" = "0" ]; then idle=$((idle+1)); else idle=0; fi
            # Queue empty (or everything waiting on backoff) for ~15 min → stop.
            [ "$idle" -ge 15 ] && break
            [ "$n" = "0" ] && sleep 60
            [ "$n" = "-1" ] && sleep 120
          done

  continue:
    needs: crawl
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Re-dispatch while work remains
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(curl -sS -m 30 https://hokejhub.vercel.app/api/ingest/hokejcz | jq '[.[] | (.pending // 0)] | add')
          echo "pending jobs: $left"
          if [ "${left:-0}" -gt 0 ]; then
            gh workflow run crawl-hokejcz.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
          fi
